name: Test

on:
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: "test"
        cache-on-failure: true
    
    - name: Run tests
      run: cargo test --all-features
