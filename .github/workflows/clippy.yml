name: clippy

on:
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: "clippy"
        cache-on-failure: true
    
    - name: Clippy
      run: cargo clippy --all-targets --all-features
